name: Aptitude Mind Plus Website Quality
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-quality.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test moderation, privacy, authentication and forms
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check public/assets/app.js
          find functions -type f -name '*.js' -exec node --check {} \;
      - name: Check Python page generator
        run: python -m py_compile build_site.py
      - name: Validate database schema locally
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(Path("schema/schema.sql").read_text())
          assert {"questions", "question_images", "course_applications", "request_limits"} <= {
              name for (name,) in db.execute("SELECT name FROM sqlite_master WHERE type='table'")
          }
          print("Cloudflare D1 schema parses as SQLite.")
          PY
