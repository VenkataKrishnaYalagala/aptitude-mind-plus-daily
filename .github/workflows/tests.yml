name: Publisher validation (no publishing)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests without publishing credentials
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile publisher.py batch_publisher.py
