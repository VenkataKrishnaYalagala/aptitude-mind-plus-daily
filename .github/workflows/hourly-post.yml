name: AMP Hourly Instagram and Facebook
on:
  schedule:
    # 15 daily IST slots: 08:00, 09:00 ... 22:00
    # Minute 20 retries the same slot and is not a second post.
    - cron: '0,20 8-22 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:
    inputs:
      preview_slot:
        description: 'Optional preview slot YYYY-MM-DDTHH (08..22 IST); ignored for scheduled runs'
        type: string
        required: false
        default: ''
      live:
        description: 'Actually publish (requires approval gates and Meta secrets)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: amp-hourly-publishing
  cancel-in-progress: false
jobs:
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run publisher safety and mathematics tests
        run: python -m unittest discover -s tests -v
      - name: Generate mathematically checked practice question and images
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LIVE: ${{ inputs.live }}
          PREVIEW_SLOT: ${{ inputs.preview_slot }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_LIVE" = "true" ] && [ -n "$PREVIEW_SLOT" ]; then
            echo 'A custom slot may only be used for previews.'
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_LIVE" != "true" ] && [ -n "$PREVIEW_SLOT" ]; then
            python publisher.py prepare --slot "$PREVIEW_SLOT"
          else
            python publisher.py prepare
          fi
      - name: Save public cards before invoking Meta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cards data/queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: prepare hourly aptitude card'
            git push origin HEAD
          fi
      - name: Publish if enabled (safe by default)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/VenkataKrishnaYalagala/aptitude-mind-plus-daily/main
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          META_API_VERSION: v27.0
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LIVE: ${{ inputs.live }}
          PREVIEW_SLOT: ${{ inputs.preview_slot }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_LIVE" != "true" ]; then
            if [ -n "$PREVIEW_SLOT" ]; then
              python publisher.py publish --slot "$PREVIEW_SLOT"
            else
              python publisher.py publish
            fi
          else
            python publisher.py publish --live
          fi
